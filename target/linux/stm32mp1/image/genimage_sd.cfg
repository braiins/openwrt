image sd.img {
        hdimage {
                partition-table-type = "gpt"
        }

        partition fsbl1 {
                image = "tf-a.stm32"
                size = 1M
        }

        partition fsbl2 {
                image = "tf-a.stm32"
                size = 1M
        }

        partition fip {
                image = "fip.bin"
                size = 6M
        }

        partition rootfs {
                image = "rootfs.img"
                bootable = "yes"
                size = 32M
        }

        partition rootfs_data {
                image = "rootfs_data.img"
                size = 88M
        }
}
