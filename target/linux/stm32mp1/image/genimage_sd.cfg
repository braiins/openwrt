image sd.img {
        hdimage {
                partition-table-type = "gpt"
        }

        partition fsbl1 {
                image = "tf-a.stm32"
        }

        partition fsbl2 {
                image = "tf-a.stm32"
        }

        partition fip {
                image = "fip.bin"
        }

        partition rootfs {
                image = "rootfs.img"
                bootable = "yes"
                size = 128M
        }
}
